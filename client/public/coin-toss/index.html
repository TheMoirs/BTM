<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <title>Coin Toss – PTM</title>
  <meta name="description" content="Pétanque Tournament Manager - Random Coin Toss. Simply click the link &amp; install on your phone home page." />
  <meta property="og:title" content="Coin Toss – PTM" />
  <meta property="og:description" content="Pétanque Tournament Manager - Random Coin Toss. Simply click the link &amp; install on your phone home page." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/coin-toss/icon-512.png" />
  <meta name="theme-color" content="#b9a888" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Coin Toss" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/coin-toss/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/coin-toss/favicon.png?v=2" />
  <link rel="apple-touch-icon" href="/coin-toss/apple-touch-icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
      background: #e2e8f0;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; cursor: pointer; }
    .stage {
      position: fixed; inset: 0; overflow: hidden;
      user-select: none; -webkit-user-select: none;
      touch-action: none; overscroll-behavior: none;
      background: linear-gradient(#dbeafe, #f1f5f9 55%, #e2e8f0);
      --coin: min(44vw, 220px);
      --thick: calc(var(--coin) * 0.07);
    }
    .layer { position: absolute; inset: 0; opacity: 0; }
    .layer canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .hand { position: absolute; left: 50%; bottom: -6vh; width: min(92vw, 480px); transform: translateX(-50%); pointer-events: none; }
    .hand-inner svg { display: block; width: 100%; height: auto; }
    .coinwrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .shadow {
      position: absolute; width: var(--coin); height: calc(var(--coin) * 0.9); border-radius: 50%;
      background: radial-gradient(closest-side, rgba(30,20,10,0.55), rgba(30,20,10,0));
      opacity: 0; transform: translate(6%, 10%);
    }
    .fly { perspective: 900px; }
    .turn {
      width: var(--coin); height: var(--coin); transform-style: preserve-3d;
      transition: transform 450ms cubic-bezier(.2,.8,.2,1);
    }
    .turn.dragging { transition: none; }
    .spin { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
    .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .face svg { display: block; width: 100%; height: 100%; }
    .face.heads { transform: translateZ(calc(var(--thick) / 2)); }
    .face.tails { transform: rotateY(180deg) translateZ(calc(var(--thick) / 2)); }
    .edge { position: absolute; border-radius: 40%; }
    .edge.v { left: calc(50% - var(--thick) / 2); top: 4%; width: var(--thick); height: 92%;
      background: linear-gradient(90deg,#6b3a1b,#c98a55 45%,#e3a874 55%,#6b3a1b); transform: rotateY(90deg); }
    .edge.h { top: calc(50% - var(--thick) / 2); left: 4%; height: var(--thick); width: 92%;
      background: linear-gradient(180deg,#6b3a1b,#c98a55 45%,#e3a874 55%,#6b3a1b); transform: rotateX(90deg); }
    .result {
      position: absolute; left: 0; right: 0; top: 9vh; display: flex; justify-content: center; pointer-events: none;
      color: #fff; font-weight: 700; letter-spacing: .1em; font-family: Georgia, "Times New Roman", serif;
      font-size: min(18vw, 96px); text-shadow: 0 4px 18px rgba(0,0,0,0.6);
      animation: pop .3s ease-out;
    }
    @keyframes pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }
    .top { position: absolute; left: 0; right: 0; top: 0; padding: 12px; padding-top: max(12px, env(safe-area-inset-top));
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 12px;
      background: rgba(255,255,255,0.82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      box-shadow: 0 1px 2px rgba(0,0,0,.08); font-size: 14px; font-weight: 600; color: #1e293b; border: 0; }
    .pill img { width: 24px; height: 24px; border-radius: 4px; }
    .actions { display: flex; gap: 6px; }
    .bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
    .hint { border-radius: 999px; padding: 8px 16px; background: rgba(255,255,255,0.86); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      box-shadow: 0 2px 6px rgba(0,0,0,.12); font-size: 14px; color: #334155; text-align: center; }
    .hint small { display: block; font-size: 12px; color: #64748b; }
    .again { pointer-events: auto; border: 0; border-radius: 999px; padding: 12px 24px; background: #fff; color: #0f172a;
      font-size: 16px; font-weight: 600; box-shadow: 0 6px 16px rgba(0,0,0,.25); }
    [hidden] { display: none !important; }
    .modal { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    .sheet { background: #fff; border-radius: 14px; max-width: 420px; width: 100%; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.35); font-size: 14px; line-height: 1.45; }
    .sheet h2 { margin: 0 0 4px; font-size: 18px; }
    .sheet p { margin: 8px 0; color: #475569; }
    .sheet ol { margin: 8px 0; padding-left: 20px; }
    .sheet li { margin: 4px 0; }
    .sheet .row { display: flex; align-items: center; gap: 12px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin: 12px 0; }
    .sheet .row img { width: 44px; height: 44px; border-radius: 10px; }
    .sheet .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .btn { border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; padding: 8px 14px; font-weight: 600; color: #0f172a; }
    .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="layer" id="gravelLayer"><canvas id="gravel"></canvas></div>
    <div class="hand" id="hand"><div class="hand-inner" id="handArt"></div></div>

    <div class="coinwrap">
      <div class="shadow" id="shadow"></div>
      <div class="fly" id="fly">
        <div class="turn" id="turn">
          <div class="spin" id="spin">
            <div class="edge v"></div>
            <div class="edge h"></div>
            <div class="face heads" id="faceHeads"></div>
            <div class="face tails" id="faceTails"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="result" id="result" hidden></div>

    <div class="top">
      <div class="pill"><img src="/coin-toss/logo.png" alt="" /> Coin Toss</div>
      <div class="actions">
        <button class="pill" id="installBtn" type="button" hidden>⤓ Install</button>
        <button class="pill" id="closeBtn" type="button" hidden>Close</button>
      </div>
    </div>

    <div class="bottom">
      <div class="hint" id="hint">
        <strong>Swipe up</strong> to toss · <strong>slide sideways</strong> to turn the coin
        <small id="showing">Showing: Heads</small>
      </div>
      <button class="again" id="again" type="button" hidden>Toss again</button>
    </div>
  </div>

  <div class="modal" id="installHelp" hidden>
    <div class="sheet" role="dialog" aria-labelledby="installTitle">
      <h2 id="installTitle">Add Coin Toss</h2>
      <p>Put it on your home screen or desktop. It works even with no internet connection.</p>
      <div class="row"><img src="/coin-toss/icon-192.png" alt="" /><div><strong>Coin Toss</strong><br /><span style="color:#64748b;font-size:12px">PTM</span></div></div>
      <div id="installSteps"></div>
      <div class="btns">
        <button class="btn primary" id="installNow" type="button" hidden>Install</button>
        <button class="btn" id="installClose" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="/coin-toss/coin-art.js"></script>
  <script>
  (function () {
    "use strict";
    var Art = window.PennyArt;
    var $ = function (id) { return document.getElementById(id); };
    var stage = $("stage"), fly = $("fly"), turn = $("turn"), spin = $("spin"), hand = $("hand");
    var gravelLayer = $("gravelLayer"), gravel = $("gravel"), shadow = $("shadow");
    var resultEl = $("result"), hint = $("hint"), showingEl = $("showing"), again = $("again");

    $("faceHeads").innerHTML = Art.heads();
    $("faceTails").innerHTML = Art.tails();
    $("handArt").innerHTML = Art.hand();

    var phase = "hand";       // "hand" | "tossing" | "landed"
    var result = null;        // "heads" | "tails"
    var viewY = 0;            // sideways turn in degrees
    var pointer = null;

    function rnd() { var n = new Uint32Array(1); crypto.getRandomValues(n); return n[0]; }
    function randomSide() { return rnd() % 2 === 0 ? "heads" : "tails"; }
    function randomInt(min, max) { return min + (rnd() % (max - min + 1)); }
    function faceUp(deg) { return ((Math.round(deg / 180) % 2) + 2) % 2 === 0 ? "heads" : "tails"; }
    function restY() { return Math.round(window.innerHeight * 0.22); }

    function paint() { Art.paintGravel(gravel); }
    paint();
    window.addEventListener("resize", function () { paint(); if (phase === "hand") fly.style.transform = "translateY(" + restY() + "px)"; });

    function render() {
      turn.style.transform = "rotateY(" + viewY + "deg)";
      showingEl.textContent = "Showing: " + (faceUp(viewY) === "heads" ? "Heads" : "Tails");
      hint.hidden = phase !== "hand";
      again.hidden = phase !== "landed";
      resultEl.hidden = !(phase === "landed" && result);
      if (phase === "landed" && result) resultEl.textContent = result === "heads" ? "Heads" : "Tails";
    }

    function cancelAll() {
      [fly, spin, hand, gravelLayer, shadow].forEach(function (el) {
        (el.getAnimations ? el.getAnimations() : []).forEach(function (a) { a.cancel(); });
      });
    }

    function resetToHand() {
      cancelAll();
      // Pick the coin up with the side it landed on still facing up
      if (result) viewY = result === "heads" ? 0 : 180;
      result = null;
      phase = "hand";
      fly.style.transform = "translateY(" + restY() + "px)";
      render();
    }

    function toss() {
      if (phase !== "hand") return;
      var outcome = randomSide();
      var startFace = faceUp(viewY);
      // Half-turns in the air: an even number keeps the same face up
      var halfTurns = randomInt(9, 13);
      if ((halfTurns % 2 === 0) !== (outcome === startFace)) halfTurns += 1;
      var endX = halfTurns * 180;
      var endZ = randomInt(-150, 150);
      phase = "tossing";
      render();

      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var d = reduce ? 600 : 2100;
      var startY = restY();
      var peak = -Math.round(window.innerHeight * 0.38);
      fly.style.transform = "";

      fly.animate([
        { transform: "translateY(" + startY + "px) scale(1) rotate(0deg)", easing: "cubic-bezier(.15,.7,.35,1)" },
        { transform: "translateY(" + peak + "px) scale(1.55) rotate(" + endZ * 0.5 + "deg)", offset: 0.42, easing: "cubic-bezier(.55,0,.85,.4)" },
        { transform: "translateY(0px) scale(1) rotate(" + endZ + "deg)", offset: 0.84, easing: "ease-out" },
        { transform: "translateY(-14px) scale(1.03) rotate(" + endZ + "deg)", offset: 0.9, easing: "ease-in" },
        { transform: "translateY(0px) scale(1) rotate(" + endZ + "deg)", offset: 0.95 },
        { transform: "translateY(0px) scale(1) rotate(" + endZ + "deg)" }
      ], { duration: d, fill: "forwards" });
      var s = spin.animate([
        { transform: "rotateX(0deg)" },
        { transform: "rotateX(" + endX + "deg)", offset: 0.84 },
        { transform: "rotateX(" + (endX + 16) + "deg)", offset: 0.9 },
        { transform: "rotateX(" + (endX - 8) + "deg)", offset: 0.95 },
        { transform: "rotateX(" + endX + "deg)" }
      ], { duration: d, fill: "forwards", easing: "linear" });
      hand.animate([
        { transform: "translateX(-50%) translateY(0)", opacity: 1 },
        { transform: "translateX(-50%) translateY(0)", opacity: 1, offset: 0.12 },
        { transform: "translateX(-50%) translateY(60vh)", opacity: 0 }
      ], { duration: d * 0.55, fill: "forwards", easing: "ease-in" });
      gravelLayer.animate([{ opacity: 0 }, { opacity: 0, offset: 0.3 }, { opacity: 1, offset: 0.7 }, { opacity: 1 }], { duration: d, fill: "forwards" });
      shadow.animate([
        { opacity: 0, transform: "translate(6%, 10%) scale(0.4)" },
        { opacity: 0, transform: "translate(6%, 10%) scale(0.4)", offset: 0.6 },
        { opacity: 0.55, transform: "translate(6%, 10%) scale(1)", offset: 0.84 },
        { opacity: 0.4, transform: "translate(6%, 10%) scale(0.92)", offset: 0.9 },
        { opacity: 0.55, transform: "translate(6%, 10%) scale(1)" }
      ], { duration: d, fill: "forwards" });
      s.onfinish = function () { result = outcome; phase = "landed"; render(); };
    }

    // Gestures: swipe up to toss; slow sideways slide turns the coin over
    stage.addEventListener("pointerdown", function (e) {
      pointer = { x: e.clientX, y: e.clientY, t: performance.now(), baseY: viewY, mode: "none" };
      if (stage.setPointerCapture) { try { stage.setPointerCapture(e.pointerId); } catch (_) {} }
    });
    stage.addEventListener("pointermove", function (e) {
      var p = pointer;
      if (!p || phase !== "hand") return;
      var dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (p.mode === "none" && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.2) {
        p.mode = "turn";
        turn.classList.add("dragging");
      }
      if (p.mode === "turn") { viewY = p.baseY + dx * 0.9; render(); }
    });
    function settle() { turn.classList.remove("dragging"); viewY = Math.round(viewY / 180) * 180; render(); }
    stage.addEventListener("pointerup", function (e) {
      var p = pointer; pointer = null;
      if (!p) return;
      var dx = e.clientX - p.x, dy = e.clientY - p.y, dt = Math.max(1, performance.now() - p.t);
      if (p.mode === "turn") { settle(); return; }
      var isSwipeUp = dy < -50 && Math.abs(dy) > Math.abs(dx) && dy / dt < -0.25;
      if (!isSwipeUp) return;
      if (phase === "hand") toss(); else if (phase === "landed") resetToHand();
    });
    stage.addEventListener("pointercancel", function () { pointer = null; settle(); });

    window.addEventListener("keydown", function (e) {
      if (e.key === " " || e.key === "ArrowUp") {
        e.preventDefault();
        if (phase === "hand") toss(); else if (phase === "landed") resetToHand();
      }
      if (phase === "hand" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
        viewY += e.key === "ArrowLeft" ? -180 : 180; render();
      }
    });

    // Buttons shouldn't count as swipes
    Array.prototype.forEach.call(document.querySelectorAll("button"), function (b) {
      b.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    });
    again.addEventListener("click", resetToHand);

    var closeBtn = $("closeBtn");
    if (window.opener) closeBtn.hidden = false;
    closeBtn.addEventListener("click", function () { window.close(); });

    // ── Install (home screen / desktop) and offline ────────────────────────
    var INSTALLED_KEY = "btm-coin-toss-installed";
    var REMEMBER_MS = 60 * 24 * 60 * 60 * 1000;
    var standalone = (window.matchMedia && (window.matchMedia("(display-mode: standalone)").matches || window.matchMedia("(display-mode: minimal-ui)").matches)) || navigator.standalone === true;
    function remember() { try { localStorage.setItem(INSTALLED_KEY, String(Date.now())); } catch (_) {} }
    function remembered() { try { var t = Number(localStorage.getItem(INSTALLED_KEY)); return !!t && Date.now() - t < REMEMBER_MS; } catch (_) { return false; } }

    // Opened from the installed app: remember it, tidy the address
    if (/[?&]from=app\b/.test(location.search)) {
      remember();
      history.replaceState(null, "", "/coin-toss/");
    }

    var deferredPrompt = null;
    var installBtn = $("installBtn"), help = $("installHelp"), installNow = $("installNow");
    function updateInstallButton() { installBtn.hidden = standalone || remembered(); }
    updateInstallButton();

    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      installNow.hidden = false;
    });
    window.addEventListener("appinstalled", function () {
      remember(); deferredPrompt = null; help.hidden = true; updateInstallButton();
    });

    function runPrompt() {
      if (!deferredPrompt) return;
      var p = deferredPrompt; deferredPrompt = null;
      var show = function () {
        p.prompt();
        p.userChoice.then(function (c) {
          if (c.outcome === "accepted") { remember(); help.hidden = true; updateInstallButton(); }
        });
      };
      // Chrome's own install box is fitted inside this window. In the narrow pop-up
      // opened from the Leaderboard it gets cut off, so make the window roomier first.
      var isComputer = !/Android|iPhone|iPad|iPod|Mobile/.test(navigator.userAgent);
      if (isComputer && window.opener && window.outerWidth < 640) {
        try {
          window.resizeTo(Math.max(640, window.outerWidth), Math.max(820, window.outerHeight));
          window.moveTo(Math.max(0, Math.round((screen.availWidth - 640) / 2)), Math.max(0, Math.round((screen.availHeight - 820) / 2)));
        } catch (_) {}
        setTimeout(show, 250);
      } else {
        show();
      }
    }

    function platform() {
      var ua = navigator.userAgent;
      if (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) return "ios";
      if (/Android/.test(ua)) return "android";
      if (/Firefox\//.test(ua)) return "firefox";
      if (/Edg\/|Chrome\//.test(ua)) return "chromium";
      if (/Macintosh/.test(ua) && /Safari\//.test(ua)) return "mac-safari";
      return "other";
    }
    var steps = {
      ios: "<ol><li>Tap the <strong>Share</strong> button (square with an arrow pointing up).</li><li>Tap <strong>Add to Home Screen</strong>, then <strong>Add</strong>.</li></ol>",
      android: "<ol><li>Tap the browser's <strong>⋮</strong> menu.</li><li>Tap <strong>Install app</strong> or <strong>Add to Home screen</strong>, then confirm.</li></ol>",
      chromium: "<ol><li>Click the <strong>install</strong> icon at the right of the address bar.</li><li>Or in Chrome: <strong>⋮</strong> → <strong>Cast, save and share</strong> → <strong>Install page as app</strong>. In Edge: <strong>…</strong> → <strong>Apps</strong> → <strong>Install this site as an app</strong>.</li></ol>",
      "mac-safari": "<ol><li>In the menu bar choose <strong>File</strong> → <strong>Add to Dock</strong>, then <strong>Add</strong>.</li></ol>",
      firefox: "<p>Firefox can't install apps. Open this page in Chrome, Edge or Safari to add it.</p>",
      other: "<p>Use your browser's menu to <strong>Install</strong> or <strong>Add to Home Screen</strong>.</p>"
    };
    installBtn.addEventListener("click", function () {
      if (deferredPrompt) { runPrompt(); return; }
      $("installSteps").innerHTML = steps[platform()];
      help.hidden = false;
    });
    installNow.addEventListener("click", runPrompt);
    $("installClose").addEventListener("click", function () { help.hidden = true; });
    help.addEventListener("click", function (e) { if (e.target === help) help.hidden = true; });

    // Keep a copy on the device so it works offline
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/coin-toss/sw.js", { scope: "/coin-toss/" }).catch(function () {});
      });
    }

    fly.style.transform = "translateY(" + restY() + "px)";
    render();
  })();
  </script>
</body>
</html>
